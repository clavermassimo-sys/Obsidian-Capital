<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Obsidian Capital — Private Wealth Brokerage" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Obsidian" />
    <title>Obsidian Capital</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <style>
      html, body { background: #000; color: #f5f5f7; margin: 0; padding: 0; }
      #root { min-height: 100vh; }
      .initial-loader {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; background: #000; z-index: 9999;
        transition: opacity 0.3s ease;
      }
      .initial-loader__wordmark {
        font-family: -apple-system, 'Inter', sans-serif;
        font-size: 13px; font-weight: 300; letter-spacing: 0.35em;
        color: rgba(255,255,255,0.35); text-transform: uppercase;
        animation: wFade 1.2s ease-in-out forwards;
      }
      @keyframes wFade { from { opacity:0; } to { opacity:1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <span class="initial-loader__wordmark">Obsidian Capital</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
